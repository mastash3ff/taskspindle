[project]
name = "taskspindle"
version = "0.1.0"
description = "A local MCP worker orchestrator for OAuth-backed coding agents, isolated worktrees, review, recovery, and Codex-owned integration."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Brandon Sheffield" }]
keywords = ["mcp", "acp", "codex", "claude", "grok", "worktree", "orchestrator"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "fastmcp>=3.3,<4",
  "agent-client-protocol==0.12.0",
  "pydantic>=2.7,<3",
  "starlette>=1.6,<2",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/mastash3ff/taskspindle"
Changelog = "https://github.com/mastash3ff/taskspindle/blob/main/CHANGELOG.md"

[project.scripts]
taskspindle = "taskspindle.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskspindle"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
extend-exclude = [".claude"]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = ["error"]
