name: Build tag

# Builds the distribution for a tag and keeps it as an artifact. It never creates a Release:
# publishing is a separate, manually dispatched workflow that can only attach what this one built.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native isolation dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv build
      - name: Check the built version against the tag
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          for wheel in dist/*.whl; do
            built="$(basename "$wheel" | cut -d- -f2)"
            if [ "$built" != "$expected" ]; then
              echo "$wheel is version $built, but the tag says $expected"
              exit 1
            fi
          done
          echo "dist is version $expected"
      - uses: actions/upload-artifact@v4
        with:
          name: taskspindle-dist-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
