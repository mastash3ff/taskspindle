name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - name: Install the locked Claude adapter
        run: npm ci --ignore-scripts
        working-directory: src/taskspindle/_adapter
      - name: Install the wheel and run the MCP smoke test
        run: |
          uv tool install --from dist/*.whl taskspindle
          taskspindle --version
